name: Tests

on: [push, pull_request]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright -r BidPilot/requirements-media.txt
          python -m playwright install --with-deps chromium
      - name: Run engine tests
        working-directory: BidPilot/bidpilot-engine
        run: python3 -B -m unittest -v test_engine.py
      - name: Run app tests
        working-directory: BidPilot
        run: python3 -B -m unittest discover -p 'test_*.py'
